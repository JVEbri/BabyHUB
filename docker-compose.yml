version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: babyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: babyhub
      POSTGRES_PASSWORD: babyhub_local
      POSTGRES_DB: babyhub
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U babyhub" ]
      interval: 5s
      timeout: 5s
      retries: 5

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: babyhub-go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "1935:1935"
    volumes:
      - ./docker/go2rtc/go2rtc.yaml:/config/go2rtc.yaml

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: babyhub-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  mqtt-bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.mqtt
    container_name: babyhub-mqtt-bridge
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://babyhub:babyhub_local@postgres:5432/babyhub
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: babyhub-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://babyhub:babyhub_local@postgres:5432/babyhub
      GO2RTC_API_URL: http://go2rtc:1984
      GO2RTC_PUBLIC_URL: http://192.168.1.85:1984
      RTSP_WS_URL: http://192.168.1.85:9002
      NODE_TLS_REJECT_UNAUTHORIZED: 0
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: babyhub-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend

  rtsp-ws:
    build:
      context: ./rtsp-ws
      dockerfile: Dockerfile
    container_name: babyhub-rtsp-ws
    restart: unless-stopped
    ports:
      - "9002:9002" # Audio analysis API
    environment:
      - RTSP_URL=rtsp://admin:joselito88@192.168.1.115
    depends_on:
      - postgres

volumes:
  postgres_data:
